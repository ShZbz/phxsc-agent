[project]
name = "phxsc-agent"
version = "0.1.0"
description = "PhySc-agent: 学术助手/研究者 —— multi-provider, cache-first, citation-grounded"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "rich>=13.7",
    "apscheduler>=3.10",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "python-pptx>=1.0",
    "prompt-toolkit>=3.0",
    "textual>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# memory = 本地 embedding（torch 重量级，Day 2 记忆层才启用）
memory = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phxsc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需真实 Chrome + 网络的集成测试（默认跳过，PHXSC_RUN_INTEGRATION=1 时运行）",
]
